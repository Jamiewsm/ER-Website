<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Enneagram for Parenting — 4주 자녀양육 워크샵</title>
  <meta name="description" content="나를 알고, 아이를 이해하는 4주 자녀양육 워크샵. 양육의 변화는 부모의 자기이해에서 시작됩니다." />
  <meta property="og:title" content="Enneagram for Parenting" />
  <meta property="og:description" content="4주 자녀양육 워크샵 — ER 복음적 에니어그램 심화 과정" />
  <meta name="theme-color" content="#F7EEE4" />
  <link rel="preload" href="parenting-workshop/mb1.png" as="image" />
  <link rel="stylesheet" href="css/parents-brochure.css" />
</head>
<body class="pb-body pb-mode-png">
  <div class="pb-frame">
    <div class="pb-scroll" id="pb-scroll" aria-label="브로셔 페이지">
      <section class="pb-slide pb-slide--png" data-page="1" aria-label="표지">
        <img class="pb-png-page" src="parenting-workshop/mb1.png" width="1080" height="1920" alt="" decoding="async" />
      </section>
      <section class="pb-slide pb-slide--png" data-page="2" aria-label="2">
        <img class="pb-png-page" src="parenting-workshop/mb2.png" width="1080" height="1920" alt="" loading="lazy" decoding="async" />
      </section>
      <section class="pb-slide pb-slide--png" data-page="3" aria-label="3">
        <img class="pb-png-page" src="parenting-workshop/mb3.png" width="1080" height="1920" alt="" loading="lazy" decoding="async" />
      </section>
      <section class="pb-slide pb-slide--png" data-page="4" aria-label="4">
        <img class="pb-png-page" src="parenting-workshop/mb4.png" width="1080" height="1920" alt="" loading="lazy" decoding="async" />
      </section>
      <section class="pb-slide pb-slide--png" data-page="5" aria-label="5">
        <img class="pb-png-page" src="parenting-workshop/mb5.png" width="1080" height="1920" alt="" loading="lazy" decoding="async" />
      </section>
      <section class="pb-slide pb-slide--png" data-page="6" aria-label="6">
        <img class="pb-png-page" src="parenting-workshop/mb6.png" width="1080" height="1920" alt="" loading="lazy" decoding="async" />
      </section>
    </div>

    <div class="pb-progress" id="pb-progress" aria-hidden="true">
      <span class="is-active"></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <p class="pb-missing-hint" id="pb-missing-hint" hidden>
      <code>parenting-workshop/mb1.png</code> … <code>mb6.png</code> 를 넣어 주세요.
    </p>
  </div>

  <script>
    (function () {
      var scrollEl = document.getElementById("pb-scroll");
      var dots = document.querySelectorAll("#pb-progress span");
      var slides = document.querySelectorAll(".pb-slide");
      var hint = document.getElementById("pb-missing-hint");

      document.querySelectorAll(".pb-png-page").forEach(function (img) {
        img.addEventListener("error", function () {
          if (hint) hint.hidden = false;
        });
      });

      function updateProgress() {
        if (!scrollEl || !slides.length) return;
        var mid = scrollEl.scrollTop + scrollEl.clientHeight * 0.4;
        var active = 0;
        slides.forEach(function (slide, i) {
          if (slide.offsetTop <= mid) active = i;
        });
        dots.forEach(function (dot, i) {
          dot.classList.toggle("is-active", i === active);
        });
      }

      if (scrollEl) {
        scrollEl.addEventListener("scroll", updateProgress, { passive: true });
        updateProgress();
      }
    })();
  </script>
</body>
</html>
