# ER Website production deploy — site full / test-only bundle / agent deploy requests
name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'christian-enneagram/**'
      - 'theology/**'
      - 'biblical-enneagram/**'
      - 'css/reading.css'
      - 'design-system/tokens.css'
      - '_redirects'
      - 'js/sections/**'
      - 'js/app-core.js'
      - 'js/app-helpers.js'
      - 'js/app-init.js'
      - 'css/site-tailwind.css'
      - 'assets/er-visual/home-*.webp'
      - 'child-type-test/**'
      - 'css/style.css'
      - 'apply.html'
      - 'basic-course.html'
      - 'parenting-workshop.html'
      - 'parents-workshop.html'
      - 'js/parents-workshop-promo.js'
      - 'js/program-catalog.js'
      - 'js/api.js'
      - 'images/**'
      - 'ER-logo-*.png'
      - 'test.html'
      - 'css/test.css'
      - 'js/test.js'
      - 'js/diagnostic-experiment.js'
      - 'js/diagnostic-report-content.js'
      - 'js/report-support-materials.js'
      - 'test-results/**'
      - 'wrangler.toml'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/build_test_only_deploy_bundle.mjs'
      - 'scripts/build_site_only_deploy_bundle.mjs'
      - 'scripts/check_premium_test_markers.mjs'
      - 'scripts/deploy-tracks.mjs'
      - 'scripts/verify_live_test_deploy.mjs'
      - '.assetsignore'
  workflow_dispatch:
    inputs:
      track:
        description: 'Deploy track'
        required: true
        default: both
        type: choice
        options:
          - site
          - test
          - both
      ref:
        description: 'Git ref to deploy'
        required: false
        default: main
      requested_by:
        description: 'Who requested (codex/claude/cursor/human)'
        required: false
        default: human
      reason:
        description: 'Short reason for audit log'
        required: false
        default: ''
  repository_dispatch:
    types: [deploy-request]
  issue_comment:
    types: [created]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  SITE_URL: https://er-coaching.com
  WRANGLER_VERSION: '4.12.0'

jobs:
  resolve:
    if: |
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]')) &&
      (github.event_name != 'issue_comment' || (
        github.event.comment.user.type != 'Bot' &&
        !endsWith(github.event.comment.user.login, '[bot]') &&
        startsWith(github.event.comment.body, '/deploy ')
      ))
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.resolve.outputs.track }}
      ref: ${{ steps.resolve.outputs.ref }}
      requested_by: ${{ steps.resolve.outputs.requested_by }}
      reason: ${{ steps.resolve.outputs.reason }}
      sha: ${{ steps.source.outputs.sha }}
      deploy_site: ${{ steps.resolve.outputs.deploy_site }}
      deploy_test: ${{ steps.resolve.outputs.deploy_test }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve deploy intent
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;
            let track = 'skip';
            let ref = 'main';
            let requestedBy = 'github-actions';
            let reason = '';
            let deploySite = false;
            let deployTest = false;
            let sha = context.sha;

            const applyTrack = (t) => {
              if (t === 'site') { deploySite = true; track = 'site'; }
              if (t === 'test') { deployTest = true; track = 'test'; }
              if (t === 'both') { deploySite = true; deployTest = true; track = 'both'; }
            };

            if (event === 'workflow_dispatch') {
              const inputs = context.payload.inputs || {};
              applyTrack(inputs.track || 'both');
              ref = inputs.ref || 'main';
              requestedBy = inputs.requested_by || 'human';
              reason = inputs.reason || '';
            } else if (event === 'repository_dispatch') {
              const p = context.payload.client_payload || {};
              applyTrack(p.track || 'both');
              ref = p.ref || 'main';
              requestedBy = p.requested_by || 'unknown';
              reason = p.reason || '';
            } else if (event === 'issue_comment') {
              const body = (context.payload.comment.body || '').trim();
              const m = body.match(/^\/deploy\s+(site|test|both)\b/i);
              applyTrack(m[1].toLowerCase());
              requestedBy = 'issue-comment';
              reason = `comment by ${context.payload.comment.user.login}`;
            } else if (event === 'push') {
              const { execSync } = require('child_process');
              const before = context.payload.before;
              const after = context.sha;
              let files = [];
              try {
                files = execSync(`git diff --name-only ${before} ${after}`, { encoding: 'utf8' })
                  .split('\n')
                  .filter(Boolean);
              } catch (e) {
                files = [];
              }
              const inferred = JSON.parse(execSync(
                `node scripts/infer_deploy_track.mjs --files ${files.map((f) => JSON.stringify(f)).join(' ')}`,
                { encoding: 'utf8' }
              ));
              deploySite = inferred.deploySite;
              deployTest = inferred.deployTest;
              track = inferred.track;
              requestedBy = 'main-push';
              reason = 'auto path inference on main push';
            }

            core.setOutput('track', track);
            core.setOutput('ref', ref);
            core.setOutput('requested_by', requestedBy);
            core.setOutput('reason', reason);
            core.setOutput('sha', sha);
            core.setOutput('deploy_site', deploySite ? 'true' : 'false');
            core.setOutput('deploy_test', deployTest ? 'true' : 'false');

      - name: Resolve one immutable deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || steps.resolve.outputs.ref }}

      - name: Record resolved source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-test:
    needs: resolve
    if: needs.resolve.outputs.track != 'skip' && needs.resolve.outputs.deploy_test == 'true'
    runs-on: ubuntu-latest
    outputs:
      verified_at: ${{ steps.verified.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject legacy test in repository
        run: node --test tests/premium-test-guard.test.mjs

      - name: Build test-only bundle
        run: |
          node scripts/build_test_only_deploy_bundle.mjs \
            --base "$GITHUB_WORKSPACE" \
            --source "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/er-deploy-bundle" \
            --site "$SITE_URL"

      - name: Deploy test-only bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ runner.temp }}/er-deploy-bundle
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy

      - name: Post-deploy verify (premium markers on live)
        run: node "$GITHUB_WORKSPACE/scripts/verify_live_test_deploy.mjs" --site "$SITE_URL" --min-child-bytes 25000

      - name: Record successful test verification time
        id: verified
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  deploy-site:
    needs: [resolve, deploy-test]
    if: |
      always() &&
      needs.resolve.outputs.track != 'skip' &&
      needs.resolve.outputs.deploy_site == 'true' &&
      (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      verified_at: ${{ steps.verified.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject legacy test in repository
        run: node --test tests/premium-test-guard.test.mjs

      - name: Require live premium test before site-only deploy
        if: needs.deploy-test.result == 'skipped'
        run: |
          node scripts/check_premium_test_markers.mjs --url "$SITE_URL/js/test.js" || {
            echo "::error::Live test is legacy. Run deploy with track=test (or both) before site deploy."
            exit 1
          }

      - name: Build site-only bundle (preserve live test runtime)
        run: |
          node scripts/build_site_only_deploy_bundle.mjs \
            --source "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/er-site-bundle" \
            --site "$SITE_URL"

      - name: Deploy site-only bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ runner.temp }}/er-site-bundle
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy

      - name: Post-deploy landing verify
        run: node "$GITHUB_WORKSPACE/scripts/verify_live_test_deploy.mjs" --site "$SITE_URL" --min-child-bytes 25000

      - name: Record successful site verification time
        id: verified
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  update-ledger:
    needs: [resolve, deploy-site, deploy-test]
    if: |
      always() &&
      needs.resolve.outputs.track != 'skip' &&
      (needs.deploy-site.result == 'success' || needs.deploy-test.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update deploy ledger
        env:
          SITE_RESULT: ${{ needs.deploy-site.result }}
          TEST_RESULT: ${{ needs.deploy-test.result }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          VERIFIED_AT: ${{ needs.deploy-site.outputs.verified_at || needs.deploy-test.outputs.verified_at }}
          REQUESTED_BY: ${{ needs.resolve.outputs.requested_by }}
          REASON: ${{ needs.resolve.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          node scripts/update_deploy_ledger.mjs \
            --site-result "$SITE_RESULT" \
            --test-result "$TEST_RESULT" \
            --sha "$SOURCE_SHA" \
            --verified-at "$VERIFIED_AT" \
            --run-url "$RUN_URL" \
            --method "GitHub Actions Deploy Production" \
            --by "$REQUESTED_BY" \
            --notes "$REASON"

      - name: Push isolated ledger branch
        id: ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bot/deploy-ledger-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add docs/_meta/DEPLOY_LEDGER.md
          git commit -m "chore(deploy): update DEPLOY_LEDGER [skip deploy]"
          git push origin HEAD:"$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open ledger pull request
        id: pr
        uses: actions/github-script@v7
        env:
          LEDGER_BRANCH: ${{ steps.ledger.outputs.branch }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              base: 'main',
              head: process.env.LEDGER_BRANCH,
              title: `chore(deploy): record ${process.env.SOURCE_SHA.slice(0, 7)} [skip deploy]`,
              body: [
                'CI-generated deployment ledger only. No production files change.',
                `Source: ${process.env.SOURCE_SHA}`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                'Merge through the protected-branch PR path after checking the current live deployment.',
              ].join('\n\n'),
            });
            await core.summary.addHeading('Deployment ledger pull request').addLink(`#${pr.number}`, pr.html_url).addRaw('\nPR created; main is updated only after merge.').write();
            core.setOutput('url', pr.html_url);

  notify:
    needs: [resolve, deploy-site, deploy-test, update-ledger]
    if: always() && needs.resolve.outputs.track != 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize deploy result
        run: |
          {
            echo "## Deploy Production summary"
            echo "- track: ${{ needs.resolve.outputs.track }}"
            echo "- requested_by: ${{ needs.resolve.outputs.requested_by }}"
            echo "- reason: ${{ needs.resolve.outputs.reason }}"
            echo "- site job: ${{ needs.deploy-site.result }}"
            echo "- test job: ${{ needs.deploy-test.result }}"
            echo "- ledger PR creation: ${{ needs.update-ledger.result }} (main persistence requires PR merge)"
          } >> "$GITHUB_STEP_SUMMARY"
