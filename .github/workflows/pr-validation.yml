name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "codex/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure and security assumptions
        run: python3 scripts/validate_repo.py
