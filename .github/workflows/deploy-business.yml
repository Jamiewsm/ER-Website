# ER Business production deploy — isolated from er-coaching.com site/test tracks
name: Deploy ER Business

on:
  pull_request:
    paths:
      - "business/**"
      - ".github/workflows/deploy-business.yml"
  push:
    branches: [main]
    paths:
      - "business/**"
      - ".github/workflows/deploy-business.yml"
  workflow_dispatch:

concurrency:
  group: deploy-er-business-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: business/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run verify

      - name: Deploy isolated Cloudflare Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify custom domain
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          routes=("/" "/programs" "/about" "/contact" "/privacy" "/terms" "/sitemap.xml")
          for route in "${routes[@]}"; do
            verified=false
            for attempt in 1 2 3 4; do
              if curl --fail --silent --show-error \
                "https://business.er-coaching.com${route}" > /dev/null; then
                verified=true
                break
              fi
              sleep 5
            done
            if [ "${verified}" != "true" ]; then
              echo "::error::ER Business route verification failed: ${route}"
              exit 1
            fi
          done
