# 공개 검색 페이지와 기존 교육 동선의 회귀를 검사한다.
name: Site SEO checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'christian-enneagram/**'
      - 'theology/**'
      - 'biblical-enneagram/**'
      - 'css/reading.css'
      - '_redirects'
      - 'design-system/tokens.css'
      - '*workshop.html'
      - 'basic-course.html'
      - 'child-type-test/**'
      - 'js/sections/home.js'
      - 'js/sections/apply.js'
      - 'js/program-catalog.js'
      - 'js/api.js'
      - 'js/app-core.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/deploy-tracks.mjs'
      - 'tests/seo-foundation.test.mjs'
      - 'tests/application-flow.test.mjs'
      - 'tests/apply-workshop-render.test.mjs'
      - 'tests/program-catalog-routing.test.mjs'
      - '.github/workflows/site-seo-checks.yml'
      - '.github/workflows/deploy-production.yml'
permissions:
  contents: read
jobs:
  site-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application JavaScript
        run: |
          node --check js/api.js
          node --check js/sections/apply.js
          node --check js/program-catalog.js
          node --check js/app-core.js
      - run: node --test tests/seo-foundation.test.mjs tests/site-ministry-boundary.test.mjs tests/basic-course-october-site.test.mjs tests/theology-navigation.test.mjs tests/mobile-site-layout.test.mjs tests/infer-deploy-track.test.mjs tests/application-flow.test.mjs tests/apply-workshop-render.test.mjs tests/program-catalog-routing.test.mjs
