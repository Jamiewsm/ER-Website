name: Deploy ER MCP servers

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/er-education-mcp/**'
      - 'supabase/functions/er-coach-mcp/**'
      - 'supabase/functions/er-website-mcp/**'
      - 'supabase/functions/_shared/er-mcp/**'
      - 'supabase/config.toml'
      - '.github/workflows/er-mcp-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: er-mcp-deploy-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check supabase/functions/er-education-mcp/index.ts supabase/functions/er-coach-mcp/index.ts supabase/functions/er-website-mcp/index.ts
      - run: deno test --allow-env supabase/functions/_shared/er-mcp/operations_test.ts supabase/functions/_shared/er-mcp/server_test.ts

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deploy credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'SUPABASE_ACCESS_TOKEN repository secret is required for ER MCP deployment.' >&2
            exit 1
          fi
      - name: Deploy three MCP functions from main
        run: |
          npx --yes supabase@2.118.0 functions deploy \
            er-education-mcp er-coach-mcp er-website-mcp \
            --project-ref osdynbadhtfgoxilgmpy \
            --use-api --no-verify-jwt
