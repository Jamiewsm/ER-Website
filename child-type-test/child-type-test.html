<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부모 관찰형 · 우리 아이 유형 관찰 테스트</title>
<style>
  :root{
    --ink:#2C2E24; --muted:#6B6E5A; --soft:#9A9C88;
    --green:#6E7A35; --green-d:#4C5524; --green-bg:#EEF0DF;
    --clay:#BC6A3D; --clay-bg:#F6EBE1; --gold:#BE9430;
    --line:#E6E2D6; --cream:#FAF7EF; --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    color:var(--ink); background:var(--cream);
    line-height:1.7; word-break:keep-all;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 80px;}

  /* top bar */
  .bar{position:sticky;top:0;z-index:20;background:rgba(250,247,239,.92);
    backdrop-filter:saturate(140%) blur(6px);padding:14px 0 10px;border-bottom:1px solid var(--line);}
  .bar .rainbow{height:4px;border-radius:4px;
    background:linear-gradient(90deg,#B0573B,#C99A3C,#6E8B6A,#2F8F87,#4E7C9B,#7E6BA6,#C77E9A);opacity:.9;margin-bottom:10px;}
  .bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding:0 18px;}
  .kicker{font-size:11px;letter-spacing:.28em;color:var(--green);font-weight:800;text-transform:uppercase;}
  .step-meta{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .pbar{height:6px;background:var(--green-bg);border-radius:6px;overflow:hidden;max-width:760px;margin:10px auto 0;}
  .pbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .35s ease;}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px;margin-top:22px;
    box-shadow:0 8px 30px -22px rgba(44,46,36,.4);}
  h1{font-family:"AppleMyungjo",serif;font-weight:400;font-size:27px;line-height:1.34;color:#343A1B;margin:4px 0 14px;letter-spacing:.01em;}
  h2{font-family:"AppleMyungjo",serif;font-weight:400;font-size:21px;color:var(--green-d);margin:0 0 6px;}
  .rule{width:48px;height:3px;background:var(--gold);border-radius:3px;margin:0 0 18px;}
  p{margin:0 0 .7em;}
  .lead{font-size:15px;color:var(--muted);}
  .small{font-size:13px;color:var(--soft);}
  strong{color:var(--green-d);font-weight:700;}
  .core-q{background:var(--green-bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--green-d);font-weight:600;margin-bottom:6px;}
  .type-cap{font-size:12px;letter-spacing:.2em;color:var(--clay);font-weight:800;text-transform:uppercase;}

  /* guide list */
  ul.guide{list-style:none;padding:0;margin:8px 0 0;}
  ul.guide li{position:relative;padding:8px 0 8px 26px;border-bottom:1px dashed var(--line);font-size:14px;color:var(--muted);}
  ul.guide li:before{content:"";position:absolute;left:6px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--gold);}

  /* situations */
  .chk{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:#fff;transition:.15s;}
  .chk:hover{border-color:var(--green);}
  .chk.on{background:var(--green-bg);border-color:var(--green);}
  .chk .box{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--soft);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;}
  .chk.on .box{background:var(--green);border-color:var(--green);}
  .chk span.t{font-size:14.5px;}

  /* questions */
  .q{padding:16px 0;border-bottom:1px solid var(--line);}
  .q:last-child{border-bottom:0;}
  .q .qt{font-size:15px;margin-bottom:11px;}
  .q .qt .rev{display:inline-block;font-size:11px;color:#fff;background:var(--clay);border-radius:6px;padding:1px 7px;margin-left:6px;font-weight:700;vertical-align:middle;}
  .scale{display:flex;gap:7px;flex-wrap:wrap;}
  .scale button{flex:1 1 0;min-width:42px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px 7px;cursor:pointer;font-family:inherit;color:var(--muted);transition:.12s;}
  .scale button .n{display:block;font-size:16px;font-weight:800;color:var(--ink);line-height:1.1;}
  .scale button .l{display:block;font-size:10px;margin-top:3px;color:var(--soft);}
  .scale button:hover{border-color:var(--green);}
  .scale button.sel{background:var(--green);border-color:var(--green-d);}
  .scale button.sel .n,.scale button.sel .l{color:#fff;}
  .scale button.sel0{background:var(--soft);border-color:var(--soft);}
  .scale button.sel0 .n,.scale button.sel0 .l{color:#fff;}
  .legend{font-size:12px;color:var(--soft);margin-top:4px;}

  /* AB choice */
  .ab{display:grid;gap:12px;margin-top:8px;}
  .ab .opt{border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;background:#fff;transition:.15s;}
  .ab .opt:hover{border-color:var(--green);}
  .ab .opt.on{background:var(--green-bg);border-color:var(--green);}
  .ab .opt .tag{font-size:12px;font-weight:800;color:var(--clay);letter-spacing:.06em;}
  .ab .opt .txt{font-size:14.5px;margin-top:3px;}
  .pair-h{font-weight:800;color:var(--green-d);margin:20px 0 8px;font-size:15px;}
  .pair-h:first-child{margin-top:4px;}

  /* wings */
  .wing{border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;margin-bottom:10px;background:#fff;transition:.15s;}
  .wing:hover{border-color:var(--green);}
  .wing.on{background:var(--clay-bg);border-color:var(--clay);}
  .wing .wn{font-weight:800;color:var(--clay);font-size:15px;}
  .wing .wd{font-size:14px;color:var(--muted);margin-top:2px;}

  /* nav */
  .nav{display:flex;gap:12px;margin-top:24px;}
  .btn{flex:1;border:0;border-radius:13px;padding:15px;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;transition:.15s;}
  .btn.primary{background:var(--green-d);color:#fff;}
  .btn.primary:hover{background:var(--green);}
  .btn.primary:disabled{background:#C7CBB4;cursor:not-allowed;}
  .btn.ghost{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--muted);padding:15px 22px;}
  .btn.ghost:hover{border-color:var(--green);color:var(--green-d);}

  .warn{font-size:13px;color:var(--clay);margin-top:10px;display:none;}
  .warn.show{display:block;}

  /* results */
  .verdict{background:linear-gradient(135deg,#343A1B,#4C5524);color:#fff;border-radius:18px;padding:28px 24px;text-align:center;margin-bottom:8px;}
  .verdict .vk{font-size:12px;letter-spacing:.26em;opacity:.8;font-weight:700;text-transform:uppercase;}
  .verdict .vmain{font-family:"AppleMyungjo",serif;font-size:40px;margin:10px 0 6px;letter-spacing:.02em;}
  .verdict .vtail{font-size:15px;opacity:.9;}
  .conf{display:inline-block;margin-top:14px;padding:6px 16px;border-radius:30px;font-size:13px;font-weight:800;}
  .conf.high{background:var(--green-bg);color:var(--green-d);}
  .conf.mid{background:#FBF1D6;color:#8a6a18;}
  .conf.low{background:var(--clay-bg);color:var(--clay);}

  table.scores{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;}
  table.scores th,table.scores td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;}
  table.scores th{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  table.scores td.num{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;}
  table.scores tr.top1 td{background:var(--green-bg);}
  .barcell{position:relative;}
  .barcell i{display:block;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--gold));}

  .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .pill{background:var(--green-bg);color:var(--green-d);border-radius:30px;padding:6px 14px;font-size:13px;font-weight:700;}

  .disc{background:var(--clay-bg);border-left:4px solid var(--clay);border-radius:0 12px 12px 0;padding:14px 16px;font-size:13.5px;color:#7a4a2a;margin-top:18px;}
  .interp{font-size:14.5px;color:var(--muted);}
  .interp .q-shift{color:var(--green-d);font-weight:700;}

  @media (max-width:520px){
    h1{font-size:23px;} .verdict .vmain{font-size:32px;}
    .scale button .l{display:none;}
    .scale button{padding:11px 4px;}
  }
  @media print{
    .bar,.nav,.btn{display:none !important;}
    body{background:#fff;} .card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid;}
  }
</style>
</head>

</div>

const state = {
  situations:new Set(),
  type:{},      // {1:[v,...8], ...}
  conf:{},      // {pairIndex:'A'|'B'}
  wing:null,
  inst:{SP:[],SO:[],SX:[]},
};
for(let t=1;t<=9;t++) state.type[t]=Array(8).fill(null);
for(const k of ['SP','SO','SX']) state.inst[k]=Array(8).fill(null);

/* 관찰 문항 풀: 기본유형 72 + 본능 24 = 96문항을 한 덩어리로 무작위 셔플.
   부모(테스트하는 사람)에게는 유형/번호/날개/본능 정보를 일절 노출하지 않는다. */
const PER_PAGE = 8;
const POOL = [];
for(let t=1;t<=9;t++) TYPES[t].q.forEach((text,i)=> POOL.push({text, kind:'type', t, i}));
for(const k of ['SP','SO','SX']) INSTINCTS[k].q.forEach((text,i)=> POOL.push({text, kind:'inst', k, i}));
for(let i=POOL.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=POOL[i]; POOL[i]=POOL[j]; POOL[j]=tmp; }
const PAGES = Math.ceil(POOL.length/PER_PAGE);

function poolVal(it){ return it.kind==='type' ? state.type[it.t][it.i] : state.inst[it.k][it.i]; }
function setPoolVal(it,v){ if(it.kind==='type') state.type[it.t][it.i]=v; else state.inst[it.k][it.i]=v; }

/* 스텝: intro, situation, 관찰문항 페이지 × PAGES, transition, confusion, wing, result */
const STEPS = ['intro','situation'];
for(let p=0;p<PAGES;p++) STEPS.push('q'+p);
STEPS.push('transition','confusion','wing','result');
let stepIdx = 0;
let cache = {}; // 계산 결과 캐시

/* ============================================================
   채점 로직
   ============================================================ */
function typeTotal(t){
  const a = state.type[t]; let sum=0;
  for(let i=0;i<8;i++){
    const v=a[i];
    if(v===null||v===0) continue;        // 0 = 제외
    sum += (i===REVERSE_INDEX) ? (6-v) : v; // 역점수 1↔5
  }
  return sum;
}
function ranked(){
  const arr=[];
  for(let t=1;t<=9;t++) arr.push({t, total:typeTotal(t)});
  arr.sort((x,y)=> y.total-x.total || x.t-y.t);
  return arr;
}
function confidence(r){
  const gap = r[0].total - r[1].total;
  if(gap>=8) return {gap, level:'high', label:'확신도 높음'};
  if(gap>=4) return {gap, level:'mid',  label:'확신도 보통'};
  return {gap, level:'low', label:'확신도 낮음'};
}
function instTotal(k){ return state.inst[k].reduce((s,v)=> s+(v||0),0); }

function compute(){
  const r = ranked();
  const conf = confidence(r);
  const top3 = r.slice(0,3).map(x=>x.t);

  // 혼동쌍: 상위 후보끼리만
  const relPairs = PAIRS.map((p,idx)=>({...p,idx}))
    .filter(p=> top3.includes(p.a) && top3.includes(p.b));

  // 혼동쌍 승점
  const wins = {}; top3.forEach(t=>wins[t]=0);
  relPairs.forEach(p=>{
    const c = state.conf[p.idx];
    if(c==='A') wins[p.a]++;
    else if(c==='B') wins[p.b]++;
  });

  // 최종 메인유형 결정
  let main;
  if(conf.level==='high'){
    main = r[0].t;                       // 확신도 높으면 점수 1위 확정
  }else{
    // 보통/낮음: 혼동쌍 승점 최다 → 동점이면 점수순
    main = top3.slice().sort((x,y)=>
      (wins[y]-wins[x]) || (typeTotal(y)-typeTotal(x)) || (x-y))[0];
  }

  const inst = [['SP',instTotal('SP')],['SO',instTotal('SO')],['SX',instTotal('SX')]]
    .sort((a,b)=> b[1]-a[1] || 0);

  return {r, conf, top3, relPairs, wins, main, inst};
}

  return wrapEl;

  const q=document.createElement('div'); q.className='q';

  qt.innerHTML = text + (isRev?'<span class="rev">역점수</span>':'');

function render(scroll){
  const step = STEPS[stepIdx];
  app.innerHTML=''; nav.innerHTML=''; warn.classList.remove('show');
  if(scroll!==false) window.scrollTo({top:0,behavior:'auto'});

  // progress
  document.getElementById('pbar').style.width = (stepIdx/(STEPS.length-1)*100)+'%';
  document.getElementById('stepMeta').textContent = stepLabel(step);

  if(step==='intro')        renderIntro();
  else if(step==='situation') renderSituation();
  else if(step[0]==='q' && step.length>1) renderQuestions(+step.slice(1));
  else if(step==='transition') renderTransition();
  else if(step==='confusion') renderConfusion();
  else if(step==='wing')    renderWing();
  else if(step==='result')  renderResult();
}

function stepLabel(step){
  if(step==='intro') return '시작';
  if(step==='situation') return '상황 관찰';
  if(step[0]==='q' && step.length>1) return '관찰 문항 '+(+step.slice(1)+1)+'/'+PAGES;
  if(step==='transition') return '거의 다 됐어요';
  if(step==='confusion') return '비교 문항';
  if(step==='wing') return '마지막 비교';
  if(step==='result') return '결과';
}

}

      <li>그 상황을 <strong>피하거나 도망친다</strong> (숨거나, 자리를 뜨거나, 딴짓으로 돌린다)</li>
    </ul>
    <p class="small">아래 중 우리 아이가 <strong>유독 자주·크게 이렇게 반응하는 장면</strong>을 모두 골라주세요.</p>
    <p class="legend">여러 개 선택 가능 · 참고용이며 점수에는 반영되지 않습니다.</p>`;
  const list=document.createElement('div');
  SITUATIONS.forEach((s,i)=>{
    const row=document.createElement('div');
    row.className='chk'+(state.situations.has(i)?' on':'');
    row.innerHTML=`<span class="box">${state.situations.has(i)?'✓':''}</span><span class="t">${i+1}. ${s}</span>`;
    row.onclick=()=>{
      if(state.situations.has(i)) state.situations.delete(i); else state.situations.add(i);
      render(false);
    };
    list.appendChild(row);
  });
  c.appendChild(list);
  app.appendChild(c);
  navButtons({nextLabel:'관찰 문항 시작', onNext:()=>{stepIdx++;render();}});
}

function renderQuestions(pageIdx){
  const start = pageIdx*PER_PAGE;
  const items = POOL.slice(start, start+PER_PAGE);
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<span class="type-cap">관찰 문항 · ${pageIdx+1} / ${PAGES}</span>
    <h2>평소 우리 아이의 모습과 얼마나 가까운가요?</h2><div class="rule"></div>
    <p class="legend">0 관찰부족 · 1 전혀 아니다 · 2 드물다 · 3 상황에 따라 · 4 자주 · 5 매우 자주</p>`;
  items.forEach((it,k)=>{
    const num = start+k+1;
    c.appendChild(questionBlock(`${num}. ${it.text}`, false, poolVal(it), (v)=>{
      setPoolVal(it, v); render(false);
    }));
  });
  app.appendChild(c);
  const last = (pageIdx===PAGES-1);
  navButtons({nextLabel:(last?'응답 마치기':'다음'), onNext:()=>{
    if(!items.every(it=> poolVal(it)!==null)){ warn.classList.add('show'); return; }
    stepIdx++; render();
  }});
}

function renderTransition(){
  cache = compute();
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<span class="type-cap">거의 다 됐어요</span>
    <h2>관찰 응답이 모두 기록되었어요</h2><div class="rule"></div>
    <p class="lead">마지막으로, 아이의 모습을 더 또렷하게 구분하기 위한 <strong>비교 문항</strong> 몇 개만 골라주시면 결과를 보여드릴게요.</p>
    <p class="small">두 가지 설명 중 우리 아이에게 더 가까운 쪽을 고르는 방식이에요. 오래 고민하지 말고 첫 느낌으로 선택해주세요.</p>`;
  app.appendChild(c);
  navButtons({nextLabel:'비교 문항 시작', onNext:()=>{stepIdx++;render();}});
}

function renderConfusion(){
  cache = compute();
  const {relPairs}=cache;
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<span class="type-cap">비교 문항</span><h2>둘 중 더 가까운 쪽은?</h2><div class="rule"></div>
    <p class="small">각 묶음에서 우리 아이에게 <strong>더 가까운 설명</strong> 하나를 골라주세요.</p>`;
  if(relPairs.length===0){
    c.innerHTML+=`<p style="margin-top:10px;color:var(--muted);">추가로 구분할 비교 문항이 없어요. 바로 다음으로 진행해주세요.</p>`;
  }
  relPairs.forEach((p,n)=>{
    const h=document.createElement('div'); h.className='pair-h'; h.textContent=`비교 ${n+1}`;
    c.appendChild(h);
    const ab=document.createElement('div'); ab.className='ab';
    [['A',p.A],['B',p.B]].forEach(([key,txt])=>{
      const o=document.createElement('div');
      o.className='opt'+(state.conf[p.idx]===key?' on':'');
      o.innerHTML=`<div class="txt">${txt}</div>`;
      o.onclick=()=>{ state.conf[p.idx]=key; render(false); };
      ab.appendChild(o);
    });
    c.appendChild(ab);
  });
  app.appendChild(c);
  navButtons({nextLabel:'다음', onNext:()=>{ cache=compute(); stepIdx++; render(); }});
}

function renderWing(){
  cache=compute();
  const main=cache.main;
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<span class="type-cap">마지막 비교</span><h2>둘 중 아이에게 더 가까운 쪽은?</h2><div class="rule"></div>
    <p class="small">마지막으로 두 가지 설명 중 우리 아이에게 더 가까운 쪽을 골라주세요. (잘 모르겠으면 선택하지 않고 넘어가도 됩니다.)</p>`;
  WINGS[main].forEach(([wn,wd])=>{
    const w=document.createElement('div');
    w.className='wing'+(state.wing===wn?' on':'');
    w.innerHTML=`<div class="wd" style="font-size:15px;color:var(--ink);">${wd}</div>`;
    w.onclick=()=>{ state.wing=wn; render(false); };
    c.appendChild(w);
  });
  app.appendChild(c);
  navButtons({nextLabel:'결과 보기', onNext:()=>{stepIdx++;render();}});
}


function renderResult(){
  cache=compute();
  const {r,conf,top3,inst,main,wins}=cache;
  const wing = state.wing;
  const dom = inst[0][0];
  const wingStr = wing? main+'w'+wing : main+'w?';
  const headline = `${dom} ${wingStr}`;

  const c=document.createElement('div'); c.className='card';
  // verdict
  const v=document.createElement('div'); v.className='verdict';
  v.innerHTML=`<div class="vk">현재 관찰상</div>
    <div class="vmain">${headline}</div>
    <div class="vtail">${dom} 본능 · ${main}번 ${TYPES[main].title}${wing?` · ${main}w${wing} 날개`:''} 가능성이 높습니다</div>
    <div><span class="conf ${conf.level}" style="margin-top:16px;">${conf.label}</span></div>`;
  c.appendChild(v);

  // 후보 안내
  const cand=document.createElement('p'); cand.className='small'; cand.style.marginTop='14px';
  cand.innerHTML = conf.level==='high'
    ? `1위 유형이 뚜렷하여 <strong>${main}번</strong>을 우선 가설로 봅니다.`
    : `상위 후보가 가까워 혼동쌍 비교를 반영했습니다. 보조 후보: <strong>${top3.filter(t=>t!==main).map(t=>t+'번').join(', ')}</strong> 도 함께 관찰하세요.`;
  c.appendChild(cand);
  app.appendChild(c);

  // 기본유형 점수표
  const c2=document.createElement('div'); c2.className='card';
  const max=r[0].total||1; let rows='';
  r.forEach((x,i)=>{
    rows+=`<tr class="${x.t===main?'top1':''}"><td>${i+1}</td><td><strong>${x.t}번</strong> ${TYPES[x.t].title}</td>
      <td class="barcell"><i style="width:${Math.round(x.total/max*100)}%"></i></td><td class="num">${x.total}</td></tr>`;
  });
  c2.innerHTML=`<h2>기본유형 점수</h2><div class="rule"></div>
    <table class="scores"><thead><tr><th>순위</th><th>유형</th><th>분포</th><th>총점</th></tr></thead><tbody>${rows}</tbody></table>`;
  app.appendChild(c2);

  // 본능 순서
  const c3=document.createElement('div'); c3.className='card';
  const im=inst[0][1]||1;
  let irows='';
  inst.forEach(([k,val])=>{
    irows+=`<tr class="${k===dom?'top1':''}"><td><strong>${k}</strong></td><td>${INSTINCTS[k].name.split(' (')[0]}</td>
      <td class="barcell"><i style="width:${Math.round(val/im*100)}%"></i></td><td class="num">${val}</td></tr>`;
  });
  c3.innerHTML=`<h2>본능 순서</h2><div class="rule"></div>
    <table class="scores"><thead><tr><th>본능</th><th>이름</th><th>분포</th><th>점수</th></tr></thead><tbody>${irows}</tbody></table>
    <div class="pill-row"><span class="pill">${inst.map(x=>x[0]).join(' > ')}</span></div>`;
  app.appendChild(c3);

  // 해석 (Part 8)
  const c4=document.createElement('div'); c4.className='card';
  c4.innerHTML=`<span class="type-cap">Part 8</span><h2>부모를 위한 해석</h2><div class="rule"></div>
    <p class="interp">이 결과는 아이를 고정하는 이름표가 아닙니다. 오히려 부모가 아이를 더 깊이 이해하기 위한 <strong>질문</strong>입니다.</p>
    <p class="interp">“왜 저렇게 행동하지?” 에서<br>
      <span class="q-shift">“무엇이 저 아이를 불안하게 만들까?”</span><br>
      <span class="q-shift">“무엇이 저 아이에게 사랑과 안정감을 느끼게 할까?”</span><br>
      <span class="q-shift">“어떤 방식으로 하나님이 주신 아이의 본래 모습을 회복시킬 수 있을까?”</span> 로 이동하는 것이 이 관찰지의 목적입니다.</p>
    <p class="interp">아이의 유형을 아는 목적은 아이를 조종하기 위함이 아니라, 아이의 <strong>두려움 뒤에 있는 욕구</strong>를 이해하고, 그 욕구를 더 건강한 방식으로 돌보도록 돕기 위함입니다.</p>
    <div class="disc"><strong>이 결과는 진단이 아니라 ‘현재 관찰상의 가설’입니다.</strong> 아이는 성장하며 다르게 보일 수 있습니다. 아이와의 대화, 추가 관찰, 전문가 상담을 통해 보완해 주세요.</div>`;
  app.appendChild(c4);

  // 결과지 해석상담 CTA
  const c5=document.createElement('div'); c5.className='card';
  c5.style.background='linear-gradient(135deg,#F6EBE1,#FAF7EF)';
  c5.style.borderColor='var(--clay)';
  c5.innerHTML=`<span class="type-cap">다음 단계 · 선택</span>
    <h2>결과지, 혼자 해석하기 어려우신가요?</h2><div class="rule"></div>
    <p class="interp">이 결과는 <strong>‘현재 관찰상의 가설’</strong>입니다. 코치와 1:1로 결과지를 함께 보며, 이 유형이 우리 아이의 실제 모습과 맞는지 확인하고 아이의 욕구·두려움을 더 건강하게 돌보는 <strong>양육 방향</strong>을 정리해 드립니다.</p>
    <div class="pill-row" style="margin:12px 0 2px;">
      <span class="pill">1:1 온라인 상담</span>
      <span class="pill">약 1시간</span>
      <span class="pill" style="background:var(--clay);color:#fff;">$50</span>
    </div>`;
  const cta=document.createElement('button');
  cta.className='btn primary';
  cta.style.width='100%'; cta.style.display='block'; cta.style.marginTop='16px';
  cta.style.background='var(--clay)';
  cta.textContent='결과지 해석상담 신청하기 · 1시간 $50';
  cta.onmouseenter=()=>cta.style.background='#a85a30';
  cta.onmouseleave=()=>cta.style.background='var(--clay)';
  cta.onclick=()=>{ window.location.href='../index.html#apply?focus=result_consult'; };
  c5.appendChild(cta);
  app.appendChild(c5);

  // 액션
  const b1=document.createElement('button'); b1.className='btn ghost'; b1.textContent='이전';
  b1.onclick=()=>{stepIdx--;render();};
  const b2=document.createElement('button'); b2.className='btn primary'; b2.textContent='결과 인쇄 / PDF 저장';
  b2.onclick=()=>window.print();
  const b3=document.createElement('button'); b3.className='btn ghost'; b3.textContent='처음부터';
  b3.onclick=()=>{ if(confirm('모든 응답을 지우고 처음부터 다시 시작할까요?')) location.reload(); };
  nav.appendChild(b1); nav.appendChild(b2); nav.appendChild(b3);
}

render();
</script>
