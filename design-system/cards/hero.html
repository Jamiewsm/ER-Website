<!-- @dsCard name="Hero Pattern" group="Screens" -->
<!-- ER 홈 히어로 패턴 카드 — MaruBuri 헤드라인 + 듀얼 CTA + 신뢰 스트립 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ER · Hero</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<link rel="stylesheet" href="../tokens.css">
<style>
body{font-family:var(--er-font-sans);background:var(--er-base);color:var(--er-body);margin:0;padding:24px}
.mock{background:var(--er-surface);border:1px solid var(--er-sand);border-radius:20px;overflow:hidden;box-shadow:var(--er-shadow-card)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;padding:44px;align-items:center}
.kicker{font-size:11px;font-weight:700;color:var(--er-green);letter-spacing:.1em;margin-bottom:12px}
h3{font-family:var(--er-font-display);font-size:28px;line-height:1.35;color:var(--er-ink-soft);word-break:keep-all;font-weight:700;margin:0 0 14px}
h3 em{font-style:normal;color:var(--er-green-deep)}
.hero p{font-size:14px;max-width:400px;margin:0 0 20px;word-break:keep-all}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:12px 24px;border-radius:9999px}
.btn-primary{background:var(--er-ink);color:#fff;box-shadow:var(--er-shadow-soft)}
.btn-secondary{background:var(--er-surface);color:var(--er-ink);border:1px solid var(--er-sand);margin-left:10px}
.visual{background:linear-gradient(160deg,var(--er-green-tint),var(--er-sand));border-radius:16px;height:220px;display:flex;align-items:center;justify-content:center;color:var(--er-muted);font-size:12px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--er-sand)}
.trust div{padding:16px;text-align:center;border-right:1px solid var(--er-sand)}
.trust div:last-child{border-right:none}
.trust b{display:block;font-size:19px;color:var(--er-ink-soft);font-variant-numeric:tabular-nums}
.trust span{font-size:11px;color:var(--er-muted)}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:28px}}
</style>
</head>
<body>
<div class="mock">
  <div class="hero">
    <div>
      <div class="kicker">🌱 나를 이해하고, 관계를 회복하는 시간</div>
      <h3>나는 왜 이렇게 반응하고,<br><em>사랑하는 사람</em>은 왜<br>그렇게 행동할까요?</h3>
      <p>ER은 에니어그램과 회복의 관점으로 더 나은 관계와 건강한 나를 만드는 여정을 함께합니다.</p>
      <button class="btn btn-primary">나에게 맞는 프로그램 찾기 →</button><button class="btn btn-secondary">무료 에니어그램 검사</button>
    </div>
    <div class="visual">실사 사진 영역</div>
  </div>
  <div class="trust">
    <div><b>400+</b><span>누적회원</span></div>
    <div><b>98%</b><span>만족도</span></div>
    <div><b>10년+</b><span>전문가 경력</span></div>
    <div><b>4.9/5</b><span>후기 평점</span></div>
  </div>
</div>
</body>
</html>
