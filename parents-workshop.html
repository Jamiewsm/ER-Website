<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Enneagram for Parents — 워크샵 신청</title>
  <meta name="description" content="4주 자녀양육 심화 워크샵. 소규모 선착순 · 온라인 Zoom · $120" />
  <meta property="og:title" content="Enneagram for Parents" />
  <meta property="og:description" content="QR 신청 안내 — ER 4주 부모 워크샵" />
  <meta name="theme-color" content="#F7EEE4" />
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/parents-workshop-landing.css" />
</head>
<body class="pw-body">
  <main class="pw-frame">
    <div class="pw-hero">
      <div class="pw-inner">
        <div class="pw-sheet">
          <p class="pw-eyebrow">Enneagram for Restoration</p>
          <span class="pw-badge">소규모 선착순</span>
          <h1 class="pw-title">Enneagram for Parents</h1>
          <p class="pw-tagline">나를 알고, 아이를 이해하는<br />4주 자녀양육 워크샵</p>
          <p class="pw-lead">양육의 변화는 부모의 자기이해에서 시작됩니다.</p>

          <div class="pw-chips" aria-label="과정 요약">
            <span class="pw-chip">4주 · 주 1회</span>
            <span class="pw-chip">6월–7월</span>
            <span class="pw-chip">온라인 Zoom</span>
            <span class="pw-chip">$120</span>
          </div>

          <p class="pw-note">
            <strong>심화 과정입니다.</strong> ER을 통해 유형을 어느 정도 알고 계신 부모님을 위한 과정이며, 에니어그램 입문 강의가 아닙니다.
          </p>

          <div class="pw-actions">
            <a class="pw-btn pw-btn--primary" id="pw-apply" href="#">워크샵 신청하기</a>
            <a class="pw-btn pw-btn--secondary" href="/parents-brochure.html">모바일 브로셔 보기</a>
            <a class="pw-btn pw-btn--ghost" id="pw-email" href="mailto:restoration.son@gmail.com?subject=Enneagram%20for%20Parents%20문의">이메일로 문의하기</a>
          </div>

          <p class="pw-contact">
            Instagram:
            <a href="https://www.instagram.com/enneagram_for_restoration/" target="_blank" rel="noopener noreferrer">@enneagram_for_restoration</a>
          </p>

          <p class="pw-footer">
            <a href="/">ER 홈페이지</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var PRODUCTION_ORIGIN = 'https://er-coaching.com';
      var applyPath = '/#apply?track=paid&focus=parents_workshop';
      var origin = window.location.origin;
      var isLocal = /^localhost$|^127\.0\.0\.1$/.test(window.location.hostname);
      var siteOrigin = isLocal ? origin : PRODUCTION_ORIGIN;

      var applyEl = document.getElementById('pw-apply');
      if (applyEl) applyEl.href = siteOrigin + applyPath;

      var brochureLink = document.querySelector('.pw-btn--secondary');
      if (brochureLink && isLocal) brochureLink.href = origin + '/parents-brochure.html';
    })();
  </script>
</body>
</html>
