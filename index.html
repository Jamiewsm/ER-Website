        body { 
            font-family: 'Pretendard', sans-serif;

        .chart-container {
            position: relative;

        @media (min-width: 768px) {

        /* Improved Background Pattern */

            background-color: #FDFBF7;
            background-image: radial-gradient(#BFA68A 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            opacity: 0.3;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Mobile Menu Transition */
        #mobile-menu {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            transform-origin: top;
        }
        #mobile-menu.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scaleY(0.95);
        }
        #mobile-menu:not(.hidden) {
            opacity: 1;
            pointer-events: auto;
            transform: scaleY(1);
        }
        
        .break-keep { word-break: keep-all; }
        
        /* Text Highlight Animation */
        .text-highlight {
            background: linear-gradient(120deg, rgba(191, 166, 138, 0.2) 0%, rgba(191, 166, 138, 0.2) 100%);
            background-repeat: no-repeat;

        .radio-btn:checked + label {
            background-color: #2C2A29;
            color: #FFFFFF;
            border-color: #2C2A29;
        }

        .smooth-transition { transition: all 0.3s ease; }
    </style>

        // --- Core Functions ---
        function renderSection(sectionId, payload = null) {
            state.currentSection = sectionId;
            const main = document.getElementById('main-content');
            
            // Close mobile menu
            document.getElementById('mobile-menu').classList.add('hidden');
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'auto' }); 

            let html = '';
            switch(sectionId) {
                case 'home': html = renderHome(); break;
                case 'about': html = renderAbout(); break;
                case 'programs': html = renderPrograms(); break;
                case 'community': html = renderCommunity(); break;
                case 'resources': html = renderResources(); break;
                case 'test': html = renderTest(); break;
                case 'notices': html = renderNotices(); break;
                case 'notice_detail': html = renderNoticeDetail(payload); break;
                case 'types_guide': html = renderTypesGuide(); break; 
                case 'apply': html = renderApply(payload); break;
                case 'mypage': html = renderMyPage(); break;
                case 'thankyou': html = renderThankYou(); break;
                default: html = renderHome();
            }

            main.innerHTML = html;
            
            // Post-render actions
            if(sectionId === 'home') setTimeout(() => initCharts('home'), 100);
            if(sectionId === 'community') setTimeout(() => initCharts('community'), 100);
            if(sectionId === 'programs') updateProgramView(state.programFilter);
            if(sectionId === 'test') initTest();
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');

                }
            };

            const selected = data[filterType];

            if(introEl) {
                introEl.innerHTML = `
                    <h3 class="text-lg font-bold text-er-dark mb-1">${selected.title}</h3>
                    <p class="text-xs text-gray-500 break-keep">${selected.desc}</p>
                `;
            }

            if(cardsEl) {
                cardsEl.innerHTML = selected.cards.map(c => `
                    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm hover:shadow-card transition-all group flex flex-col h-full">
                        <div class="flex items-center justify-between mb-4">
                            <span class="px-2.5 py-1 rounded-full bg-er-base text-er-accent text-[10px] font-bold uppercase tracking-wider">${c.b}</span>
                            <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-er-dark group-hover:text-white transition-colors text-sm">
                                <i class="${c.i}"></i>
                            </div>
                        </div>
                        <h4 class="text-base font-bold text-gray-900 mb-2">${c.t}</h4>
                        <p class="text-gray-500 text-xs leading-relaxed mb-6 flex-grow break-keep">${c.d}</p>
                        <button onclick="renderSection('apply')" class="w-full py-2.5 rounded-xl border border-gray-200 text-gray-600 font-bold text-xs hover:bg-er-dark hover:text-white hover:border-transparent transition-all">
                            문의하기
                        </button>
                    </div>
                `).join('');
            }
        }

        function toggleLogin() { 
            if (state.user) { renderSection('mypage'); } 
            else { alert('회원가입/로그인 기능은 준비 중입니다.'); } 
        }
        
        function logoutUser() { 
            state.user = null; 
            renderSection('home'); 
        }

        // --- Enneagram Test Logic ---
        function initTest() {
            const container = document.getElementById('questions-container');
            if (!container) return;

            container.innerHTML = "";
            enneagramQuestions.forEach((question, index) => {
                container.insertAdjacentHTML("beforeend", `
                    <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-gray-100" id="q-block-${index}">
                        <p class="text-base sm:text-lg font-medium text-gray-800 mb-5 break-keep">
                            <span class="text-er-accent font-bold mr-2">${index + 1}.</span>${question}
                        </p>
                        <div class="flex justify-between items-center gap-2 sm:px-2">
                            <span class="text-[10px] sm:text-xs text-gray-400 font-bold whitespace-nowrap">전혀 아니다</span>
                            <div class="flex space-x-1.5 sm:space-x-3">
                                ${[1, 2, 3, 4, 5].map((val) => `
                                    <div class="relative">
                                        <input type="radio" name="q${index}" value="${val}" id="q${index}-${val}" class="peer sr-only radio-btn">
                                        <label for="q${index}-${val}" class="w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center rounded-full border-2 border-gray-200 text-gray-500 cursor-pointer peer-hover:border-er-accent smooth-transition font-medium bg-white text-sm sm:text-base">
                                            ${val}
                                        </label>
                                    </div>
                                `).join("")}
                            </div>
                            <span class="text-[10px] sm:text-xs text-gray-400 font-bold whitespace-nowrap">매우 그렇다</span>
                        </div>
                    </div>
                `);
            });
        }

        function submitSurvey() {
            const scores = [];
            let isComplete = true;

            for (let i = 0; i < enneagramQuestions.length; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                const block = document.getElementById(`q-block-${i}`);

                if (selected) {
                    scores.push(parseInt(selected.value, 10));
                    block.classList.remove("border-red-300", "bg-red-50");
                } else {
                    isComplete = false;
                    block.classList.add("border-red-300", "bg-red-50");
                }
            }

            if (!isComplete) {
                document.getElementById("validation-msg").classList.remove("hidden");
                const firstMissed = document.querySelector(".border-red-300");
                if (firstMissed) firstMissed.scrollIntoView({ behavior: "smooth", block: "center" });
                return;
            }

            document.getElementById("validation-msg").classList.add("hidden");

            // 1단계: 코어 및 본능 기초 연산
            const tHeart = scores[0] + scores[3];
            const tHead = scores[1] + scores[4];
            const tGut = scores[2] + scores[5];

            const coreBase = {
                1: tGut + scores[8],
                2: tHeart + scores[9],
                3: tHeart + scores[10],
                4: tHeart + scores[11],
                5: tHead + scores[12],
                6: tHead + scores[13],
                7: tHead + scores[14],
                8: tGut + scores[6],
                9: tGut + scores[7]
            };

            const instBase = { sp: scores[15], sx: scores[16], so: scores[17] };

            // 2단계: 하위 유형 데이터 통합
            const typeData = [];
            let totalSp = instBase.sp;
            let totalSx = instBase.sx;
            let totalSo = instBase.so;

            for (let i = 1; i <= 9; i++) {
                const subStartIdx = 18 + ((i - 1) * 3);
                const spScore = scores[subStartIdx];
                const sxScore = scores[subStartIdx + 1];
                const soScore = scores[subStartIdx + 2];

                totalSp += spScore;
                totalSx += sxScore;
                totalSo += soScore;

                const totalWeight = coreBase[i] + spScore + sxScore + soScore;
                typeData.push({ id: i, totalWeight, avg: totalWeight / 4 });
            }

            typeData.sort((a, b) => b.totalWeight - a.totalWeight);
            const primaryType = typeData[0].id;

            const instincts = [
                { name: "자기보존", code: "sp", score: totalSp },
                { name: "성적(일대일)", code: "sx", score: totalSx },
                { name: "사회적", code: "so", score: totalSo }
            ].sort((a, b) => b.score - a.score);

            const bestInstinctCode = instincts[0].code;

            // 3단계: 교차 검증
            let finalType = primaryType;
            let logMsg = "교차 검증 결과, 1차 도출 코어와 심층 무의식적 동기가 일치합니다.";

            if (primaryType === 8 || primaryType === 6) {
                if (scores[46] > scores[45]) {
                    finalType = 6;
                    logMsg = "방어적 태도 분석: 8번이 아닌 역유형 6번의 동기(불안 통제)로 판별되었습니다.";
                } else if (scores[45] > scores[46]) {
                    finalType = 8;
                    logMsg = "방어적 태도 분석: 6번이 아닌 8번의 순수 통제 욕구로 판별되었습니다.";
                }
            } else if (primaryType === 9 || primaryType === 4) {
                if (scores[48] > scores[47]) {
                    finalType = 4;
                    logMsg = "내향성 분석: 9번의 회피가 아닌 4번의 자아 몰입 동기로 판별되었습니다.";
                }
            } else if (primaryType === 9 || primaryType === 5) {
                if (scores[50] > scores[49]) {
                    finalType = 5;
                    logMsg = "은둔 성향 분석: 9번의 평화 유지가 아닌 5번의 자원 보존 동기로 판별되었습니다.";
                }
            } else if (primaryType === 9 || primaryType === 2 || primaryType === 7) {
                const maxVal = Math.max(scores[51], scores[52], scores[53]);
                if (maxVal === scores[51]) {
                    finalType = 9;
                } else if (maxVal === scores[52]) {
                    finalType = 2;
                    logMsg = "관계 형성 분석: 2번의 인정 동기가 우세하게 나타났습니다.";
                } else if (maxVal === scores[53]) {
                    finalType = 7;
                    logMsg = "관계 형성 분석: 7번의 즐거움 추구 동기가 우세하게 나타났습니다.";
                }
            } else if (primaryType === 4 || primaryType === 1 || primaryType === 7) {
                const maxVal2 = Math.max(scores[54], scores[55], scores[56]);
                if (maxVal2 === scores[54]) {
                    finalType = 4;
                } else if (maxVal2 === scores[55]) {
                    finalType = 1;
                    logMsg = "고통 대처 분석: 1번의 개선 동기가 우세하게 나타났습니다.";
                } else if (maxVal2 === scores[56]) {
                    finalType = 7;
                    logMsg = "고통 대처 분석: 7번의 회피/재해석 동기가 우세하게 나타났습니다.";
                }
            } else if (primaryType === 1 || primaryType === 8) {
                if (scores[57] > scores[58]) {
                    finalType = 1;
                    logMsg = "통제력 분석: 8번이 아닌 성적 1번의 타인 개혁 의지로 판별되었습니다.";
                } else if (scores[58] > scores[57]) {
                    finalType = 8;
                    logMsg = "통제력 분석: 1번이 아닌 8번 본연의 생존 통제 욕구로 판별되었습니다.";
                }
            }

            // 4단계: 날개 연산
            const leftWing = (finalType === 1) ? 9 : finalType - 1;
            const rightWing = (finalType === 9) ? 1 : finalType + 1;

            const lData = typeData.find((t) => t.id === leftWing);
            const rData = typeData.find((t) => t.id === rightWing);

            let wingNum = "없음";
            let wingResultFormat = `${finalType} (순수유형)`;

            if (lData.avg > 2.0 || rData.avg > 2.0) {
                wingNum = (lData.avg >= rData.avg) ? leftWing : rightWing;
                wingResultFormat = `${finalType}w${wingNum}`;
            }

            document.getElementById("survey-view").classList.add("hidden");
            document.getElementById("result-view").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });

            document.getElementById("res-final").innerText = `${bestInstinctCode} ${wingResultFormat}`;
            document.getElementById("res-instincts").innerText = `1위 ${instincts[0].name} / 2위 ${instincts[1].name}`;
            document.getElementById("res-core").innerText = `${finalType}번`;
            document.getElementById("res-wing").innerText = (wingNum === "없음") ? "활성화되지 않음" : `${wingNum}번 날개`;
            document.getElementById("res-log").innerText = logMsg;

            state.latestTestResult = {
                finalLabel: `${bestInstinctCode} ${wingResultFormat}`,
                coreType: finalType,
                wingLabel: wingNum === "없음" ? "활성화되지 않음" : `${wingNum}번`,
                instinctSummary: `${instincts[0].name} > ${instincts[1].name}`
            };
        }

        // --- Chart Logic ---
        function initCharts(sectionId) {
            Chart.defaults.font.family = "'Pretendard', sans-serif";
            Chart.defaults.color = '#9CA3AF';
            
            if (sectionId === 'home') {
                const ctx = document.getElementById('heroChart');
                if(!ctx) return;
                
                new Chart(ctx.getContext('2d'), {
                    type: 'polarArea',
                    data: {
                        labels: contentData.types.labels,
                        datasets: [{ 
                            data: contentData.types.data, 
                            backgroundColor: [
                                'rgba(217, 119, 119, 0.8)', 
                                'rgba(229, 208, 192, 0.8)', 
                                'rgba(242, 201, 76, 0.8)',  
                                'rgba(187, 107, 217, 0.8)', 
                                'rgba(86, 204, 242, 0.8)',  
                                'rgba(111, 207, 151, 0.8)', 
                                'rgba(39, 174, 96, 0.8)',   
                                'rgba(235, 87, 87, 0.8)',   
                                'rgba(189, 189, 189, 0.8)'  
                            ],
                            borderWidth: 2,
                            borderColor: '#ffffff',
                            hoverOffset: 4
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        layout: { padding: 10 },
                        plugins: { 
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(44, 42, 41, 0.9)',
                                padding: 10,
                                cornerRadius: 8,
                                titleFont: { size: 12 },
                                bodyFont: { size: 10 },
                                callbacks: {
                                    title: (items) => items[0].label,
                                    label: () => ''
                                }
                            }
                        }, 
                        scales: { 
                            r: { 
                                ticks: { display: false }, 
                                grid: { color: '#f3f4f6', lineWidth: 1 },
                                pointLabels: { display: false } 
                            } 
                        } 
                    }
                });
            } else if (sectionId === 'community') {
                const ctx = document.getElementById('impactChart');
                if(!ctx) return;

                new Chart(ctx.getContext('2d'), {
                    type: 'bar',
                    data: { 
                        labels: contentData.stats.labels, 
                        datasets: [{ 
                            label: '케이스 분포 (%)', 
                            data: contentData.stats.data, 
                            backgroundColor: '#BFA68A', 
                            borderRadius: 4,
                            barThickness: 20
                        }] 
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        plugins: { legend: { display: false } }, 
                        scales: { 
                            y: { beginAtZero: true, grid: { display: false }, ticks: { display: false } }, 
                            x: { grid: { display: false }, ticks: { font: { size: 10 } } } 
                        } 
                    }
                });
            }
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => { 
            window.addEventListener('scroll', () => {
                const nav = document.getElementById('navbar');
                if(window.scrollY > 20) {
                    nav.classList.add('shadow-sm', 'bg-white/95');
                    nav.classList.remove('bg-white/80');
                } else {
                    nav.classList.remove('shadow-sm', 'bg-white/95');
                    nav.classList.add('bg-white/80');
                }
            });
            
            renderSection('home'); 
        });
    </script>
</body>
